project:
  type: website
  output-dir: docs
  render:
    - index.qmd
  resources:
    - site-assets/

website:
  title: "highcharter shiny"
  site-url: "https://jbkunst.github.io/highcharter-shiny/"
  repo-url: "https://github.com/jbkunst/highcharter-shiny"
  search: false
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Gallery
    right:
      - icon: github
        href: "https://github.com/jbkunst/highcharter-shiny"
        aria-label: "GitHub repository"
format:
  html:
    theme:
      - cosmo
      - site-assets/highcharter.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
